<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Días de Cartas Para Ti 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Carga tus mensajes y configuración -->
  <script src="cartas-data.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 50%, #ffd1dc 100%);
      --env-body: #ff8fa3;
      --env-flap: #ff758f;
      --env-pocket: #ffb3c1;
      --env-pocket-dark: #ff9eb0;
      --seal-color: #c9184a;
      --paper-bg: #fffdf9;
      --text-main: #4a2532;
      --accent: #c9184a;
      --shadow-color: rgba(201, 24, 74, 0.22);
    }

    [data-theme="vintage"] {
      --bg-gradient: linear-gradient(135deg, #f7efe5 0%, #efe1d1 50%, #e4d0b8 100%);
      --env-body: #c8a986;
      --env-flap: #b5926b;
      --env-pocket: #d9bfa0;
      --env-pocket-dark: #cbb090;
      --seal-color: #8b2635;
      --paper-bg: #fcf8f0;
      --text-main: #3e2c23;
      --accent: #8b2635;
      --shadow-color: rgba(62, 44, 35, 0.22);
    }

    [data-theme="lavender"] {
      --bg-gradient: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #d8b4fe 100%);
      --env-body: #a855f7;
      --env-flap: #9333ea;
      --env-pocket: #c084fc;
      --env-pocket-dark: #b06ef8;
      --seal-color: #6b21a8;
      --paper-bg: #fdfaff;
      --text-main: #3b0764;
      --accent: #7e22ce;
      --shadow-color: rgba(107, 33, 168, 0.22);
    }

    [data-theme="midnight"] {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --env-body: #334155;
      --env-flap: #1e293b;
      --env-pocket: #475569;
      --env-pocket-dark: #3b485c;
      --seal-color: #d97706;
      --paper-bg: #fffbeb;
      --text-main: #1e293b;
      --accent: #b45309;
      --shadow-color: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 1.5rem 1rem;
      transition: background 0.6s ease;
    }

    #particles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      animation: floatUp linear forwards;
      opacity: 0;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(-105vh) scale(1.2) rotate(25deg); opacity: 0; }
    }

    .day-nav {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
    }

    .day-badge-title {
      font-family: 'Dancing Script', cursive;
      font-size: 1.85rem;
      color: var(--accent);
      text-shadow: 0 2px 10px rgba(255,255,255,0.4);
    }

    [data-theme="midnight"] .day-badge-title { color: #fbbf24; }

    .days-pills {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .day-pill {
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .day-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .day-pill.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stage {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2.5rem;
    }

    .envelope-wrapper {
      position: relative;
      width: 340px;
      height: 230px;
      perspective: 1200px;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .envelope-wrapper:not(.open):hover {
      transform: translateY(-8px) scale(1.02);
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: var(--env-body);
      border-radius: 12px;
      box-shadow: 0 22px 45px var(--shadow-color);
    }

    .letter {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      height: 205px;
      background: var(--paper-bg);
      border-radius: 10px;
      padding: 1.4rem 1.3rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .envelope-wrapper.open .letter {
      height: auto;
      min-height: 410px;
      max-height: 72vh;
      width: 92vw;
      max-width: 480px;
      left: 50%;
      bottom: -35px;
      transform: translateX(-50%) translateY(-55px);
      z-index: 20;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(0, 0, 0, 0.06);
      cursor: default;
    }

    .letter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.12);
      padding-bottom: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .letter-day-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .close-letter-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-main);
      opacity: 0.5;
      cursor: pointer;
      display: none;
    }

    .envelope-wrapper.open .close-letter-btn { display: block; }
    .close-letter-btn:hover { opacity: 1; }

    .letter-greeting {
      font-family: 'Dancing Script', cursive;
      font-size: 1.75rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .polaroid-frame {
      background: #ffffff;
      padding: 0.55rem 0.55rem 1.2rem 0.55rem;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.06);
      margin: 0.5rem auto 1rem auto;
      width: 100%;
      max-width: 280px;
      transform: rotate(-1.5deg);
      transition: transform 0.3s ease;
    }

    .polaroid-frame:hover {
      transform: rotate(0deg) scale(1.02);
    }

    .polaroid-frame img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .polaroid-caption {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      text-align: center;
      color: #555;
      margin-top: 0.45rem;
    }

    .letter-body {
      font-family: 'Lora', serif;
      font-size: 1rem;
      line-height: 1.72;
      color: var(--text-main);
      white-space: pre-line;
      margin-bottom: 1.2rem;
    }

    .letter-signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: var(--accent);
      text-align: right;
      margin-top: auto;
    }

    .envelope-pocket {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: 12px;
      overflow: hidden;
    }

    .envelope-pocket::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--env-pocket) 50%, var(--env-pocket-dark) 50%);
      clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 130px;
      background: var(--env-flap);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s 0.3s;
      z-index: 4;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .wax-seal {
      position: absolute;
      top: 98px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      background: var(--seal-color);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.35);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .wax-seal span {
      font-size: 1.5rem;
      color: #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }

    .envelope-wrapper.open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      pointer-events: none;
    }

    .tap-hint {
      margin-top: 1.4rem;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.8;
      animation: pulse 2s infinite;
    }

    [data-theme="midnight"] .tap-hint { color: #f8fafc; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    .reopen-welcome-btn {
      margin-top: 1.5rem;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
      z-index: 10;
    }

    .reopen-welcome-btn:hover { background: rgba(255, 255, 255, 0.9); }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 10, 18, 0.65);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    .welcome-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .welcome-card {
      background: #fffdf9;
      max-width: 440px;
      width: 100%;
      border-radius: 20px;
      padding: 2.2rem 1.8rem;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      border: 2px solid #ffd1dc;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .welcome-overlay.visible .welcome-card {
      transform: translateY(0) scale(1);
    }

    .welcome-icon {
      font-size: 2.8rem;
      margin-bottom: 0.75rem;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    .welcome-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.85rem;
    }

    .welcome-message {
      font-family: 'Lora', serif;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #4a2532;
      margin-bottom: 1.6rem;
      white-space: pre-line;
    }

    .welcome-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.85rem 1.8rem;
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--shadow-color);
      transition: transform 0.2s, filter 0.2s;
    }

    .welcome-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
  </style>
</head>
<body>

  <div id="particles-container"></div>

  <!-- Modal de Bienvenida (Primera vez) -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <div class="welcome-icon">💌</div>
      <h2 class="welcome-title" id="welcomeTitle">Para ti, mi bella dama</h2>
      <p class="welcome-message" id="welcomeText"></p>
      <button class="welcome-btn" id="startExperienceBtn">Ver mi carta de hoy ✨</button>
    </div>
  </div>

  <!-- Navegación de Días (1 al 7) -->
  <header class="day-nav">
    <h1 class="day-badge-title" id="headerTitle">Carta del Día 1</h1>
    <div class="days-pills" id="daysPills"></div>
  </header>

  <!-- Escena del Sobre 3D -->
  <main class="stage">
    <div class="envelope-wrapper" id="envelope">
      <div class="envelope-back"></div>

      <article class="letter" id="letterPaper">
        <div class="letter-header">
          <span class="letter-day-tag" id="letterDayTag">Día 1 de 7</span>
          <button class="close-letter-btn" id="closeLetterBtn" title="Guardar carta">✕</button>
        </div>
        <h2 class="letter-greeting" id="letterGreeting">Mi bella dama,</h2>

        <div class="polaroid-frame" id="polaroidBox">
          <img id="letterPhoto" src="assets/photo1.png" alt="Nuestro recuerdo">
          <div class="polaroid-caption" id="photoCaption">Día 1</div>
        </div>

        <p class="letter-body" id="letterBody"></p>
        <div class="letter-signature" id="letterSignature">Con todo mi amor ❤️</div>
      </article>

      <div class="envelope-pocket"></div>
      <div class="envelope-flap"></div>
      <div class="wax-seal"><span>❤</span></div>
    </div>

    <p class="tap-hint" id="tapHint">Toca el sobre para abrir tu carta ✨</p>
    <button class="reopen-welcome-btn" id="reopenWelcomeBtn">Leer nota de bienvenida</button>
  </main>

  <script>
    const WELCOME_SEEN_KEY = "love_letters_welcome_seen_v1";
    const appData = window.CARTAS_CONFIG;

    let unlockedDay = 1;
    let selectedDay = 1;

    function computeUnlockedDay(startDateStr) {
      const parts = startDateStr.split("-").map(Number);
      const start = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays < 1) return 1;
      if (diffDays > 7) return 7;
      return diffDays;
    }

    function applyTheme(theme) {
      if (theme && theme !== "rose") {
        document.documentElement.setAttribute("data-theme", theme);
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
    }

    function renderDayPills() {
      const container = document.getElementById("daysPills");
      container.innerHTML = "";
      for (let d = 1; d <= 7; d++) {
        const btn = document.createElement("button");
        const isLocked = d > unlockedDay;
        btn.className = `day-pill ${d === selectedDay ? "active" : ""} ${isLocked ? "locked" : ""}`;
        btn.textContent = isLocked ? `🔒 Día ${d}` : `Día ${d}`;
        btn.onclick = () => {
          if (isLocked) {
            alert(`¡Paciencia mi amor! La carta del Día ${d} se desbloqueará pronto 💌`);
            return;
          }
          selectedDay = d;
          closeEnvelope();
          setTimeout(() => {
            renderLetter(selectedDay);
            renderDayPills();
          }, 250);
        };
        container.appendChild(btn);
      }
    }

    function renderLetter(dayNum) {
      const item = appData.days.find(x => x.day === dayNum) || appData.days[0];
      document.getElementById("headerTitle").textContent = `Carta del Día ${dayNum}`;
      document.getElementById("letterDayTag").textContent = `Día ${dayNum} de 7`;
      document.getElementById("letterGreeting").textContent = item.greeting;
      document.getElementById("letterBody").textContent = item.body;
      document.getElementById("letterSignature").textContent = item.signature;

      const polaroidBox = document.getElementById("polaroidBox");
      const img = document.getElementById("letterPhoto");
      const caption = document.getElementById("photoCaption");

      if (item.photo && item.photo.trim() !== "") {
        polaroidBox.style.display = "block";
        img.src = item.photo;
        caption.textContent = item.caption || `Día ${dayNum}`;
        img.onerror = () => {
          polaroidBox.style.display = "none";
        };
      } else {
        polaroidBox.style.display = "none";
      }
    }

    const envelope = document.getElementById("envelope");
    const tapHint = document.getElementById("tapHint");

    function openEnvelope() {
      if (!envelope.classList.contains("open")) {
        envelope.classList.add("open");
        tapHint.style.opacity = "0";
        spawnHeartsBurst();
      }
    }

    function closeEnvelope() {
      envelope.classList.remove("open");
      tapHint.style.opacity = "0.8";
    }

    envelope.addEventListener("click", (e) => {
      if (e.target.id === "closeLetterBtn") {
        e.stopPropagation();
        closeEnvelope();
        return;
      }
      openEnvelope();
    });

    function spawnHeartsBurst() {
      const container = document.getElementById("particles-container");
      const emojis = ["❤️", "💖", "✨", "💕", "🌸"];
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.className = "floating-heart";
          heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.fontSize = (16 + Math.random() * 18) + "px";
          heart.style.animationDuration = (3.5 + Math.random() * 3) + "s";
          container.appendChild(heart);
          setTimeout(() => heart.remove(), 6500);
        }, i * 110);
      }
    }

    const welcomeOverlay = document.getElementById("welcomeOverlay");
    function showWelcomeModal() {
      document.getElementById("welcomeTitle").textContent = appData.welcomeTitle || "Para ti, mi bella dama";
      document.getElementById("welcomeText").textContent = appData.welcomeMessage;
      welcomeOverlay.classList.add("visible");
    }

    document.getElementById("startExperienceBtn").addEventListener("click", () => {
      welcomeOverlay.classList.remove("visible");
      localStorage.setItem(WELCOME_SEEN_KEY, "true");
      spawnHeartsBurst();
    });

    document.getElementById("reopenWelcomeBtn").addEventListener("click", showWelcomeModal);

    // Inicialización
    applyTheme(appData.theme);
    unlockedDay = computeUnlockedDay(appData.startDate);

    // Permite probar cualquier día agregando ?dia=3 a la URL
    const urlDay = Number(new URLSearchParams(window.location.search).get("dia"));
    if (urlDay >= 1 && urlDay <= 7) {
      unlockedDay = Math.max(unlockedDay, urlDay);
      selectedDay = urlDay;
    } else {
      selectedDay = unlockedDay;
    }

    renderDayPills();
    renderLetter(selectedDay);

    if (!localStorage.getItem(WELCOME_SEEN_KEY)) {
      setTimeout(showWelcomeModal, 450);
    }
  </script>
</body>
</html>
