<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Días de Cartas Para Ti 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="cartas-data.js"></script>
</head>
<body class="letter-page">

  <div id="particles-container"></div>

  <!-- Modal de Bienvenida (Primera vez) -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <div class="welcome-icon">💌</div>
      <h2 class="welcome-title" id="welcomeTitle">Para ti, mi bella dama</h2>
      <p class="welcome-message" id="welcomeText"></p>
      <button class="welcome-btn" id="startExperienceBtn">Ver mi carta de hoy ✨</button>
    </div>
  </div>

  <!-- Navegación de Días (1 al 7) -->
  <header class="day-nav">
    <h1 class="day-badge-title" id="headerTitle">Carta del Día 1</h1>
    <div class="days-pills" id="daysPills"></div>
  </header>

  <!-- Escena del Sobre 3D -->
  <main class="stage">
    <div class="envelope-wrapper" id="envelope">
      <div class="envelope-back"></div>

      <article class="letter" id="letterPaper">
        <div class="letter-header">
          <span class="letter-day-tag" id="letterDayTag">Día 1 de 7</span>
          <button class="close-letter-btn" id="closeLetterBtn" title="Guardar carta">✕</button>
        </div>
        <h2 class="letter-greeting" id="letterGreeting">Mi bella dama,</h2>

        <div class="polaroid-frame" id="polaroidBox">
          <img id="letterPhoto" src="assets/photo1.png" alt="Nuestro recuerdo">
          <div class="polaroid-caption" id="photoCaption">Día 1</div>
        </div>

        <p class="letter-body" id="letterBody"></p>
        <div class="letter-signature" id="letterSignature">Con todo mi amor ❤️</div>
      </article>

      <div class="envelope-pocket"></div>
      <div class="envelope-flap"></div>
      <div class="wax-seal"><span>❤</span></div>
    </div>

    <p class="tap-hint" id="tapHint">Toca el sobre para abrir tu carta ✨</p>
    <button class="reopen-welcome-btn" id="reopenWelcomeBtn">Leer nota de bienvenida</button>
  </main>

  <script>
    const WELCOME_SEEN_KEY = "love_letters_welcome_seen_v1";
    const appData = window.CARTAS_CONFIG;

    let unlockedDay = 1;
    let selectedDay = 1;

    function computeUnlockedDay(startDateStr) {
      const parts = startDateStr.split("-").map(Number);
      const start = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays < 1) return 1;
      if (diffDays > 7) return 7;
      return diffDays;
    }

    function applyTheme(theme) {
      if (theme && theme !== "rose") {
        document.documentElement.setAttribute("data-theme", theme);
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
    }

    function renderDayPills() {
      const container = document.getElementById("daysPills");
      container.innerHTML = "";
      for (let d = 1; d <= 7; d++) {
        const btn = document.createElement("button");
        const isLocked = d > unlockedDay;
        btn.className = `day-pill ${d === selectedDay ? "active" : ""} ${isLocked ? "locked" : ""}`;
        btn.textContent = isLocked ? `🔒 Día ${d}` : `Día ${d}`;
        btn.onclick = () => {
          if (isLocked) {
            alert(`¡Paciencia mi amor! La carta del Día ${d} se desbloqueará pronto 💌`);
            return;
          }
          selectedDay = d;
          closeEnvelope();
          setTimeout(() => {
            renderLetter(selectedDay);
            renderDayPills();
          }, 250);
        };
        container.appendChild(btn);
      }
    }

    function renderLetter(dayNum) {
      const item = appData.days.find(x => x.day === dayNum) || appData.days[0];
      document.getElementById("headerTitle").textContent = `Carta del Día ${dayNum}`;
      document.getElementById("letterDayTag").textContent = `Día ${dayNum} de 7`;
      document.getElementById("letterGreeting").textContent = item.greeting;
      document.getElementById("letterBody").textContent = item.body;
      document.getElementById("letterSignature").textContent = item.signature;

      const polaroidBox = document.getElementById("polaroidBox");
      const img = document.getElementById("letterPhoto");
      const caption = document.getElementById("photoCaption");

      if (item.photo && item.photo.trim() !== "") {
        polaroidBox.style.display = "block";
        img.src = item.photo;
        caption.textContent = item.caption || `Día ${dayNum}`;
        img.onerror = () => {
          polaroidBox.style.display = "none";
        };
      } else {
        polaroidBox.style.display = "none";
      }
    }

    const envelope = document.getElementById("envelope");
    const tapHint = document.getElementById("tapHint");

    function openEnvelope() {
      if (!envelope.classList.contains("open")) {
        envelope.classList.add("open");
        document.body.classList.add("letter-open");
        tapHint.style.opacity = "0";
        spawnHeartsBurst();
      }
    }

    function closeEnvelope() {
      envelope.classList.remove("open");
      document.body.classList.remove("letter-open");
      tapHint.style.opacity = "0.8";
    }

    envelope.addEventListener("click", (e) => {
      if (e.target.id === "closeLetterBtn") {
        e.stopPropagation();
        closeEnvelope();
        return;
      }
      openEnvelope();
    });

    function spawnHeartsBurst() {
      const container = document.getElementById("particles-container");
      const emojis = ["❤️", "💖", "✨", "💕", "🌸"];
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.className = "floating-heart";
          heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.fontSize = (16 + Math.random() * 18) + "px";
          heart.style.animationDuration = (3.5 + Math.random() * 3) + "s";
          container.appendChild(heart);
          setTimeout(() => heart.remove(), 6500);
        }, i * 110);
      }
    }

    const welcomeOverlay = document.getElementById("welcomeOverlay");
    function showWelcomeModal() {
      document.getElementById("welcomeTitle").textContent = appData.welcomeTitle || "Para ti, mi bella dama";
      document.getElementById("welcomeText").textContent = appData.welcomeMessage;
      welcomeOverlay.classList.add("visible");
    }

    document.getElementById("startExperienceBtn").addEventListener("click", () => {
      welcomeOverlay.classList.remove("visible");
      localStorage.setItem(WELCOME_SEEN_KEY, "true");
      spawnHeartsBurst();
    });

    document.getElementById("reopenWelcomeBtn").addEventListener("click", showWelcomeModal);

    // Inicialización
    applyTheme(appData.theme);
    unlockedDay = computeUnlockedDay(appData.startDate);

    // Permite probar cualquier día agregando ?dia=3 a la URL
    const urlDay = Number(new URLSearchParams(window.location.search).get("dia"));
    if (urlDay >= 1 && urlDay <= 7) {
      unlockedDay = Math.max(unlockedDay, urlDay);
      selectedDay = urlDay;
    } else {
      selectedDay = unlockedDay;
    }

    renderDayPills();
    renderLetter(selectedDay);

    if (!localStorage.getItem(WELCOME_SEEN_KEY)) {
      setTimeout(showWelcomeModal, 450);
    }
  </script>
</body>
</html>
